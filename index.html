<script>
    function applyTheme(theme) {
        const root = document.documentElement;
        const btn = document.getElementById('themeToggle');
        const logoImg = document.querySelector('.logo-area img');
        const heroMark = document.querySelector('.hero-mark');
        const sectionMark = document.querySelector('.section-mark');
        
        if (theme === 'dark') {
            root.setAttribute('data-theme', 'dark');
            if (btn) btn.textContent = '☀️';
            if (logoImg) logoImg.src = 'images/logo-white.png';
            if (heroMark) heroMark.src = 'images/logo-mark-white.png';
            if (sectionMark) sectionMark.src = 'images/logo-mark-white.png';
        } else {
            root.removeAttribute('data-theme');
            if (btn) btn.textContent = '🌙';
            if (logoImg) logoImg.src = 'images/logo-color.png';
            if (heroMark) heroMark.src = 'images/logo-mark.png';
            if (sectionMark) sectionMark.src = 'images/logo-mark.png';
        }
    }
    applyTheme(localStorage.getItem('theme') || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light'));
    function toggleTheme() {
        const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
        const newTheme = isDark ? 'light' : 'dark';
        localStorage.setItem('theme', newTheme);
        applyTheme(newTheme);
    }
</script>
