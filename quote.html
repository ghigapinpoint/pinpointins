<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Custom Health Coverage Roadmap | Pinpoint Solution Insurance Services</title>
  <link rel="icon" type="image/png" href="images/logo-mark.png">
  <link rel="stylesheet" href="style.css">
  <style>
    :root {
      --primary: #374F62;
      --secondary: #9ACC59;
      --secondary-dark: #4b784f;
      --accent-yellow: #FDBE40;
      --dark: #0f172a;
      --text: #334155;
      --light: #f8fafc;
      --border: #cbd5e1;
      --white: #ffffff;
      --shadow: 0 4px 15px rgba(0,0,0,0.06);
    }

    /* Harmonious Midnight Slate Dark Theme Overrides */
    [data-theme="dark"] {
      --primary: #64829b;
      --secondary: #9ACC59;
      --secondary-dark: #b4e16d;
      --accent-yellow: #d99b26;
      --dark: #f1f5f9;
      --text: #9ca3af;
      --light: #0b1118;
      --border: #1f2937;
      --white: #111827;
      --shadow: 0 4px 15px rgba(0,0,0,0.3);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; }
    body { background-color: var(--light); color: var(--text); line-height: 1.6; padding-bottom: 80px; transition: background-color 0.25s ease, color 0.25s ease; }

    /* Header & Nav */
    header { background: var(--white); border-bottom: 1px solid var(--border); padding: 15px 5%; display: flex; justify-content: space-between; align-items: center; position: sticky; top: 0; z-index: 100; transition: background-color 0.25s ease, border-color 0.25s ease; }
    .logo-container { display: flex; align-items: center; gap: 12px; text-decoration: none; color: var(--dark); font-weight: 700; font-size: 1.2rem; }
    .logo-img { height: 40px; }
    .nav-links { display: flex; gap: 15px; align-items: center; }
    .nav-links a { text-decoration: none; color: var(--text); font-weight: 500; font-size: 0.95rem; }
    .nav-links a:hover { color: var(--secondary-dark); }
    
    .btn-advisor-toggle { background: var(--border); color: var(--dark); border: none; padding: 8px 14px; border-radius: 6px; font-weight: 600; cursor: pointer; display: flex; align-items: center; gap: 6px; font-size: 0.85rem; }
    .btn-advisor-toggle:hover { opacity: 0.85; }

    /* Dark Mode Toggle Button */
    .dark-mode-toggle {
        background: none;
        border: 1px solid var(--border);
        border-radius: 0.375rem;
        color: var(--text);
        padding: 0.4rem 0.65rem;
        cursor: pointer;
        font-size: 1rem;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: background 0.2s, border-color 0.2s;
    }
    .dark-mode-toggle:hover {
        background: rgba(154, 204, 89, 0.12);
        border-color: var(--secondary);
    }

    /* Main Container */
    .container { max-width: 1000px; margin: 30px auto; padding: 0 20px; }
    .hero-banner { text-align: center; margin-bottom: 30px; }
    .hero-banner h1 { color: var(--primary); font-size: 2.2rem; margin-bottom: 8px; }
    .hero-banner p { color: var(--text); opacity: 0.8; font-size: 1.05rem; }

    /* Trust Badge */
    .trust-badge { display: inline-flex; align-items: center; gap: 8px; background: rgba(3, 105, 161, 0.15); color: #38bdf8; padding: 6px 14px; border-radius: 20px; font-size: 0.85rem; font-weight: 600; margin-bottom: 15px; }

    /* Advisor Workbench Box */
    .advisor-workbench { background: var(--white); border: 2px dashed var(--primary); border-radius: 12px; padding: 20px; margin-bottom: 30px; display: none; }
    .advisor-workbench.active { display: block; }
    .advisor-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; }
    .advisor-header h3 { color: var(--primary); font-size: 1.1rem; }
    .advisor-textarea { width: 100%; height: 100px; padding: 10px; border: 1px solid var(--border); border-radius: 8px; font-family: monospace; font-size: 0.85rem; margin-bottom: 10px; background: var(--light); color: var(--text); }

    /* Form Layout */
    .card { background: var(--white); border-radius: 12px; border: 1px solid var(--border); box-shadow: var(--shadow); padding: 25px; margin-bottom: 25px; transition: background-color 0.25s ease, border-color 0.25s ease; }
    .card-title { font-size: 1.25rem; color: var(--primary); margin-bottom: 15px; border-bottom: 2px solid var(--border); padding-bottom: 8px; display: flex; align-items: center; gap: 8px; }

    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 15px; margin-bottom: 15px; }
    .form-group { display: flex; flex-direction: column; gap: 5px; }
    .form-group label { font-size: 0.88rem; font-weight: 600; color: var(--dark); }
    .form-group input, .form-group select, .form-group textarea { padding: 10px; border: 1px solid var(--border); border-radius: 6px; font-size: 0.95rem; outline: none; background: var(--light); color: var(--text); }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }

    /* Provider Pills */
    .pills-container { display: flex; flex-wrap: wrap; gap: 10px; margin-top: 8px; }
    .pill { background: var(--light); border: 1px solid var(--border); padding: 8px 14px; border-radius: 20px; font-size: 0.88rem; cursor: pointer; user-select: none; transition: all 0.2s; color: var(--text); }
